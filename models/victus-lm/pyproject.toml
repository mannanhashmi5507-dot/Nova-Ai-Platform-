[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "victus-language-model"
version = "0.1.0"
description = "Victus Language Model training, evaluation, and local serving stack for Nova AI."
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "transformers>=4.52.4",
  "datasets>=3.0",
  "accelerate>=1.0",
  "safetensors>=0.4",
  "trl>=1.13.0",
  "peft>=0.15",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34"
]

[project.scripts]
victus-train = "victus_lm.train:main"
victus-eval = "victus_lm.evaluate:main"
victus-serve = "victus_lm.serve:main"
